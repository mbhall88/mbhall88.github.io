{{- $file := .Get "src" -}}
{{- $caption := .Get "caption" | default $file -}}
{{- $csv := .Page.Resources.GetMatch $file -}}

{{- if $csv -}}
<div class="csv-table-wrapper" style="margin: 2rem 0;">
    {{- if $caption }}<h4 style="margin-bottom: 1rem;">{{ $caption }}</h4>{{ end -}}
    <div id="grid-{{ $file | anchorize }}"></div>
    <script>
        new gridjs.Grid({
            from: (function() {
                const data = {{ $csv.Content | transform.Unmarshal }};
                return {
                    columns: Object.keys(data[0]),
                    data: data.map(row => Object.values(row))
                };
            })(),
            search: true,
            sort: true,
            pagination: { limit: 10 },
            resizable: true,
            className: { table: 'gridjs-table' }
        }).render(document.getElementById("grid-{{ $file | anchorize }}"));
    </script>
</div>
{{- else -}}
    {{- errorf "CSV file not found: %s" $file -}}
{{- end -}}
