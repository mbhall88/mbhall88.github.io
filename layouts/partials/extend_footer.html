{{- if and .Site.Params.analytics.goatcounter .IsPage (eq .Type "post") -}}
<script>
document.addEventListener("DOMContentLoaded", function() {
    var path = window.location.pathname;
    // Ensure we handle both with and without trailing slash for the ID
    var statsEl = document.getElementById('stats-' + path) || 
                  document.getElementById('stats-' + path + '/') ||
                  document.getElementById('stats-' + path.replace(/\/$/, ''));
    
    if (statsEl) {
        var url = "https://mbhall88.goatcounter.com/counter/" + encodeURIComponent(path) + ".json";
        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data.count) {
                    // Format number with commas
                    statsEl.innerText = parseInt(data.count).toLocaleString() + " views";
                } else {
                    statsEl.innerText = "0 views";
                }
            })
            .catch(err => {
                console.error("Error fetching GoatCounter stats:", err);
                statsEl.innerText = ""; // Hide if error
            });
    }
});
</script>
{{- end -}}

{{- if .IsPage -}}
<script>
document.addEventListener("DOMContentLoaded", function() {
    // Convert footnote numbers to letters and handle duplicates
    const refs = document.querySelectorAll('.footnote-ref');
    const map = new Map();
    let count = 0;
    
    refs.forEach(ref => {
        const href = ref.getAttribute('href');
        if (!map.has(href)) {
            // Assign a new letter (a, b, c...)
            map.set(href, String.fromCharCode(97 + count++));
        }
        // Replace the number with the letter inside brackets
        ref.textContent = '[' + map.get(href) + ']';
    });
});
</script>
{{- end -}}
