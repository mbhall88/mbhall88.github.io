{{- if and .Site.Params.analytics.goatcounter .IsPage (eq .Type "post") -}}
<script>
document.addEventListener("DOMContentLoaded", function() {
    var path = window.location.pathname;
    var statsEl = document.getElementById('stats-' + path) || 
                  document.getElementById('stats-' + path + '/') ||
                  document.getElementById('stats-' + path.replace(/\/$/, ''));
    
    if (statsEl) {
        // Use Shields.io as a CORS-friendly proxy for GoatCounter stats
        var siteCode = "{{ .Site.Params.analytics.goatcounter.Site }}";
        var url = "https://img.shields.io/goatcounter/endpoint.json?code=" + siteCode + "&path=" + encodeURIComponent(path);
        
        fetch(url)
            .then(response => {
                if (!response.ok) {
                    // If Shields.io returns an error (like 404 badge not found)
                    // it means the page has 0 hits on a new account
                    statsEl.innerText = "0 views";
                    return null;
                }
                return response.json();
            })
            .then(data => {
                if (data && data.value) {
                    statsEl.innerText = data.value;
                }
            })
            .catch(err => {
                console.warn("GoatCounter stats unavailable.");
                statsEl.innerText = "0 views";
            });
    }
});
</script>
{{- end -}}

{{- if .IsPage -}}
<script>
document.addEventListener("DOMContentLoaded", function() {
    // Convert footnote numbers to letters and handle duplicates
    const refs = document.querySelectorAll('.footnote-ref');
    const map = new Map();
    let count = 0;
    
    refs.forEach(ref => {
        const href = ref.getAttribute('href');
        if (!map.has(href)) {
            // Assign a new letter (a, b, c...)
            map.set(href, String.fromCharCode(97 + count++));
        }
        // Replace the number with the letter inside brackets
        ref.textContent = '[' + map.get(href) + ']';
    });
});
</script>
{{- end -}}
