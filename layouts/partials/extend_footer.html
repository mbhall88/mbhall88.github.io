{{- if and .Site.Params.analytics.goatcounter .IsPage (eq .Type "post") -}}
<script>
document.addEventListener("DOMContentLoaded", function() {
    var path = window.location.pathname;
    var url = "https://mbhall88.goatcounter.com/counter/" + encodeURIComponent(path) + ".json";
    fetch(url)
        .then(response => response.json())
        .then(data => {
            var statsEl = document.getElementById('stats-' + path);
            if (statsEl && data.count) {
                statsEl.innerText = data.count + " views";
            }
        })
        .catch(err => console.error("Error fetching GoatCounter stats:", err));
});
</script>
{{- end -}}

{{- if .IsPage -}}
<script>
document.addEventListener("DOMContentLoaded", function() {
    // 1. Convert footnote numbers to letters and handle duplicates
    const refs = document.querySelectorAll('.footnote-ref a');
    const map = new Map();
    let count = 0;
    
    refs.forEach(ref => {
        const href = ref.getAttribute('href');
        if (!map.has(href)) {
            // Assign a new letter (a, b, c...)
            map.set(href, String.fromCharCode(97 + count++));
        }
        // Replace the number with [letter]
        ref.innerText = '[' + map.get(href) + ']';
    });
});
</script>
{{- end -}}
