baseURL: "https://mbhall88.github.io/"
title: "Microbes made me do it"
theme: "PaperMod"
languageCode: "en-au"
ignoreFiles: ["README.md"]
params:
  citationStyle: "nature"
  env: production
  author: "Michael Hall"
  defaultTheme: auto
  disableThemeToggle: false
  ShowCodeCopyButtons: true
  math: true

  # Fix 404s for favicons
  assets:
    favicon: ""
    favicon16x16: ""
    favicon32x32: ""
    apple_touch_icon: ""
    safari_pinned_tab: ""

  editPost:
    URL: "https://github.com/mbhall88/mbhall88.github.io/tree/master/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  profileMode:
    enabled: true
    title: "Michael Hall"
    subtitle: "Bioinformatics postdoctoral researcher at the University of Queensland's Frazer Institute. I apply computational methods to long-read sequencing data (ONT) to investigate microbial genomics, plasmid assembly, and antimicrobial resistance mechanisms. I'm also an active maintainer and developer of many open-source bioinformatics tools."
    imageUrl: "https://avatars.githubusercontent.com/u/20403931?v=4"
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: Posts
        url: /post/
      - name: Talks
        url: /talks/
      - name: GitHub
        url: https://github.com/mbhall88
      - name: CV
        url: /cv.pdf
  
  socialIcons:
    - name: github
      url: "https://github.com/mbhall88"
    - name: orcid
      url: "https://orcid.org/0000-0003-3683-6208"
    - name: googlescholar
      url: "https://scholar.google.com/citations?user=UPv5JGEAAAAJ&hl=en"
    - name: linkedin
      url: "https://www.linkedin.com/in/michael-hall-2b1bb9118/"
    - name: bluesky
      url: "https://bsky.app/profile/mbhall88.bsky.social"
    - name: rss
      url: "/index.xml"

  # RSS Feed Configuration
  rssFullText: true

  analytics:
    goatcounter:
      Site: "mbhall88"
      
  # Giscus Comments
  comments:
    giscus:
      repo: "mbhall88/mbhall88.github.io"
      repoId: "MDEwOlJlcG9zaXRvcnkxNjg1NjkwOTQ=" 
      category: "Announcements"
      categoryId: "DIC_kwDOCgwpBs4C7RAH"
      mapping: "pathname"
      strict: true
      reactionsEnabled: true
      emitMetadata: false
      theme: "preferred_color_scheme"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /post/
      weight: 10
    - identifier: talks
      name: Talks
      url: /talks/
      weight: 20

mediaTypes:
  text/x-bibliography:
    suffixes: ["bib"]

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
          - - '$$'
            - '$$'
          - - '\['
            - '\]'
          inline:
          - - '$'
            - '$'
          - - '\('
            - '\)'
